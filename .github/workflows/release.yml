name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  TAP_REPOSITORY: aleksandargosevski/homebrew-tap

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          SKICA_CERT_P12_BASE64: ${{ secrets.SKICA_CERT_P12_BASE64 }}
          SKICA_CERT_PASSWORD: ${{ secrets.SKICA_CERT_PASSWORD }}
        run: |
          if [[ -z "$SKICA_CERT_P12_BASE64" || -z "$SKICA_CERT_PASSWORD" ]]; then
            echo "::error::SKICA_CERT_P12_BASE64 and SKICA_CERT_PASSWORD secrets are required"
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/skica-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          CERT="$RUNNER_TEMP/skica-dev.p12"

          echo "$SKICA_CERT_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$SKICA_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Test
        run: ./scripts/test.sh

      - name: Build
        run: SKICA_VERSION="$VERSION" SKICA_SIGN_IDENTITY="Skica Dev" ./scripts/build.sh --zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Skica-$VERSION.zip" \
            --title "Skica $VERSION" \
            --generate-notes

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is required"
            exit 1
          fi

          SHA256="$(shasum -a 256 "build/Skica-$VERSION.zip" | cut -d ' ' -f 1)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" "$RUNNER_TEMP/tap"

          # Formulae live in the tap's root, next to the others. Homebrew ignores the root as soon
          # as a Formula/ directory exists, so none must be created.
          ./scripts/render-formula.sh "$VERSION" "$SHA256" > "$RUNNER_TEMP/tap/skica.rb"

          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skica.rb
          git commit -m "skica $VERSION"
          git push origin HEAD

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" ]]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
